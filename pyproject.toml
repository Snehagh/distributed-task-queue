[project]
name = "taskq"
version = "0.1.0"
description = "A small distributed task queue and scheduler built on Redis and PostgreSQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "redis",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008 is the idiomatic FastAPI dependency-injection pattern (Depends() in defaults).
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
